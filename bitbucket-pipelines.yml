image: public.ecr.aws/b4c6f8y3/pipeline-mc-email-api-sdk-py:latest

definitions:
  caches:
    uv: ~/.cache/uv

  steps:
    - step: &checks
        name: Lint, type-check, tests
        caches:
          - uv
        script:
          - uv sync --extra async --extra dev
          - uv run ruff check src tests examples scripts typing_tests
          - uv run mypy
          - uv run pytest --cov --cov-report=term-missing
          - uv run python scripts/check_openapi_drift.py
          - uv run python scripts/run_consumer_typing.py
          - uv build
          - uv run python scripts/smoke_wheel_install.py

    - step: &py39
        name: Tests (Python 3.9)
        caches:
          - uv
        script:
          - uv sync --python 3.9 --extra async --extra dev
          - uv run pytest -q

    - step: &py310
        name: Tests (Python 3.10)
        caches:
          - uv
        script:
          - uv sync --python 3.10 --extra async --extra dev
          - uv run pytest -q

    - step: &py311
        name: Tests (Python 3.11)
        caches:
          - uv
        script:
          - uv sync --python 3.11 --extra async --extra dev
          - uv run pytest -q

    - step: &py312
        name: Tests (Python 3.12)
        caches:
          - uv
        script:
          - uv sync --python 3.12 --extra async --extra dev
          - uv run pytest -q

    - step: &py313
        name: Tests (Python 3.13)
        caches:
          - uv
        script:
          - uv sync --python 3.13 --extra async --extra dev
          - uv run pytest -q

    - step: &publish-testpypi-step
        name: Publish to TestPyPI
        caches:
          - uv
        script:
          - uv sync --extra dev
          - rm -rf dist/
          - uv build
          - uv run twine check dist/*
          # --skip-existing lets repeated main-branch merges succeed without
          # bumping the version: TestPyPI/PyPI artifacts are immutable, so we
          # only republish when the version in pyproject.toml has actually
          # changed.
          - uv run twine upload
              --skip-existing
              --repository-url https://test.pypi.org/legacy/
              --username __token__
              --password "$PYPI_TEST_API_TOKEN"
              dist/*

    - step: &publish-pypi-step
        name: Publish to PyPI
        caches:
          - uv
        script:
          - uv sync --extra dev
          - rm -rf dist/
          - uv build
          - uv run twine check dist/*
          - uv run twine upload
              --username __token__
              --password "$PYPI_API_TOKEN"
              dist/*

pipelines:
  default:
    - step: *checks

  branches:
    main:
      # On merge to main: run the full checks once, validate the offline
      # test suite on every supported Python version, and (if all of that
      # passed) publish the build to TestPyPI. TestPyPI uploads use
      # `--skip-existing` so we only push a new artifact when the version
      # in pyproject.toml has changed.
      - step: *checks
      - parallel:
          - step: *py39
          - step: *py310
          - step: *py311
          - step: *py312
          - step: *py313
      - step: *publish-testpypi-step

  custom:
    multi-python:
      # Ad-hoc trigger for the same matrix that runs on main. Useful when
      # validating a feature branch before merging without waiting for the
      # main-branch run.
      - parallel:
          - step: *py39
          - step: *py310
          - step: *py311
          - step: *py312
          - step: *py313

    online-tests:
      # Run live MailChannels API tests. Requires MAILCHANNELS_API_KEY,
      # MAILCHANNELS_API_URL, MAILCHANNELS_ONLINE_FROM, MAILCHANNELS_ONLINE_TO
      # configured as repository or deployment variables. Trigger manually.
      - step:
          name: Live MailChannels API tests
          caches:
            - uv
          script:
            - uv sync --extra async --extra dev
            - uv run pytest -m online --online

    publish-testpypi:
      # Manual TestPyPI publish. The same step also runs automatically on
      # every merge to `main` (see `branches.main` above); this trigger
      # exists for ad-hoc dry runs on feature branches. Requires
      # PYPI_TEST_API_TOKEN configured as a secured repository variable in
      # Bitbucket.
      - step: *checks
      - step: *publish-testpypi-step

    publish-pypi:
      # Publish to real PyPI (https://pypi.org/). Runs the full check suite,
      # then builds the wheel + sdist and uploads them. Requires
      # PYPI_API_TOKEN configured as a secured repository variable in
      # Bitbucket. A given version on PyPI is immutable, so bump the version
      # in pyproject.toml before triggering, and tag the release commit
      # with `v<version>` so the source tree records what was published.
      #
      # When we're ready, this trigger should move out of `custom:` and into
      # a tag-driven block:
      #
      #     pipelines:
      #       tags:
      #         'v*':
      #           - step: *checks
      #           - step: *publish-pypi-step
      #
      # That way pushing a `v1.0.0` tag is the release action, and ordinary
      # merges to main do not republish.
      - step: *checks
      - step: *publish-pypi-step
