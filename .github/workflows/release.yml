name: Publish release to PyPI

# Publishes the latest upstream `v*` release tag to TestPyPI and then PyPI using Trusted Publishing
# (OIDC); no PyPI or TestPyPI API token is stored anywhere.
#
# Flow: a release tag is pushed on Bitbucket -> the "Sync public Bitbucket source" workflow mirrors
# it here -> this workflow runs after every successful sync (or on manual dispatch). When the latest
# tagged version is not on PyPI yet, it builds the distributions once, uploads those exact files to
# TestPyPI, then uploads the same files to PyPI. Configure required reviewers on the `pypi`
# environment so the run pauses for TestPyPI validation before the irreversible PyPI upload.
# Re-runs are safe: published versions are skipped.
#
# Trusted publisher settings for project `mailchannels` must match on both https://pypi.org and
# https://test.pypi.org:
#   owner: mailchannels
#   repository: mailchannels-email-api-sdk-py
#   workflow: release.yml
#   environment: pypi (PyPI) / testpypi (TestPyPI)

on:
  workflow_run:
    workflows: [Sync public Bitbucket source]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: mirror-release
  cancel-in-progress: false

jobs:
  build:
    name: Build release distributions
    if: >-
      github.repository == 'mailchannels/mailchannels-email-api-sdk-py' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The build job runs upstream code (build backend, tests), so it gets no
    # OIDC token; only the publish jobs below can mint one.
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.check.outputs.publish }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Find latest upstream release tag
        id: release
        run: |
          TAG=$(git tag --list 'v*' --sort=-version:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)
          if [ -z "$TAG" ]; then
            echo "::error::No vX.Y.Z release tags found"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Latest release tag: $TAG"

      - name: Check whether the version is already on PyPI
        id: check
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          STATUS=$(curl -sS -o /dev/null -w '%{http_code}' \
            "https://pypi.org/pypi/mailchannels/$VERSION/json")
          case "$STATUS" in
            200)
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "mailchannels $VERSION is already on PyPI; nothing to do" ;;
            404)
              echo "publish=true" >> "$GITHUB_OUTPUT"
              echo "mailchannels $VERSION needs publishing" ;;
            *)
              echo "::error::Unexpected PyPI response $STATUS"
              exit 1 ;;
          esac

      - name: Check out release tag
        if: steps.check.outputs.publish == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          git checkout --detach "refs/tags/$TAG"
          SOURCE_VERSION=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/mailchannels/version.py)
          if [ "$SOURCE_VERSION" != "$VERSION" ]; then
            echo "::error::Tag $TAG does not match __version__ '$SOURCE_VERSION'"
            exit 1
          fi

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: steps.check.outputs.publish == 'true'

      # Tests already ran on this commit in Bitbucket Pipelines; only verify the
      # distributions built here, since these are the files that get uploaded.
      - name: Build and verify distributions
        if: steps.check.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          uv sync --extra async --extra dev
          rm -rf dist/
          uv build
          uvx --with twine==7.0.0 twine check --strict dist/*
          uv run python scripts/smoke_wheel_install.py
          ls dist/
          for f in dist/*; do
            case "$(basename "$f")" in
              "mailchannels-$VERSION.tar.gz"|"mailchannels-$VERSION-"*.whl) ;;
              *) echo "::error::Unexpected distribution $f"; exit 1 ;;
            esac
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.check.outputs.publish == 'true'
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/project/mailchannels/${{ needs.build.outputs.version }}/
    permissions:
      # Mandatory for Trusted Publishing (OIDC) and PEP 740 attestations.
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@aef6c9b6e301dc803e1bc9133e9ce67ae9b0906b # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          # A re-run after a failed or rejected PyPI step finds this version
          # already on TestPyPI; skip it instead of failing.
          skip-existing: true

  publish-pypi:
    name: Publish to PyPI
    needs: [build, publish-testpypi]
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/mailchannels/${{ needs.build.outputs.version }}/
    permissions:
      # Mandatory for Trusted Publishing (OIDC) and PEP 740 attestations.
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@aef6c9b6e301dc803e1bc9133e9ce67ae9b0906b # v1.14.3
