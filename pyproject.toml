[project]
name = "mailchannels"
dynamic = ["version"]
description = "Python SDK for the MailChannels Email API."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "MailChannels", email = "dev@mailchannels.com" }]
keywords = [
    "mailchannels",
    "email",
    "transactional-email",
    "email-api",
    "smtp",
    "webhooks",
    "dkim",
    "sdk",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Email",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "cryptography>=42,<47",
    "eval-type-backport>=0.2,<1; python_version < '3.10'",
    "pydantic>=2.6,<3",
    "requests>=2.31,<3",
    "typing-extensions>=4.9,<5",
]

[project.urls]
Homepage = "https://bitbucket.org/mailchannels/mailchannels-email-api-sdk-py"
Source = "https://bitbucket.org/mailchannels/mailchannels-email-api-sdk-py"
Documentation = "https://bitbucket.org/mailchannels/mailchannels-email-api-sdk-py/src/main/README.md"
Issues = "https://bitbucket.org/mailchannels/mailchannels-email-api-sdk-py/issues"

[project.optional-dependencies]
async = ["httpx>=0.27,<1"]
dev = [
    "mypy>=1.10,<2",
    "openapi-spec-validator>=0.7,<0.8",
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=5,<8",
    "pyyaml>=6,<7",
    "respx>=0.21,<1",
    "ruff>=0.5,<1",
    "twine>=5,<7",
    "types-PyYAML>=6,<7",
    "types-requests>=2.31,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/mailchannels/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mailchannels"]

[tool.hatch.build.targets.sdist]
exclude = [
    ".claude/",
    ".git/",
    ".github/",
    ".venv/",
    ".mypy_cache/",
    ".ruff_cache/",
    ".pytest_cache/",
    "AGENTS.md",
    "dist/",
    "typing_tests/",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "online: tests that call the live MailChannels Email API",
    "online_destructive: live tests that create, update, or delete API resources",
]

[tool.coverage.run]
branch = true
source = ["mailchannels"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.9"
files = ["src/mailchannels", "scripts"]
strict = false
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true

[tool.uv]
package = true
